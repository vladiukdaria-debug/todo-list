{% extends "tasks/base.html" %}

{% block title %}
  Tags
{% endblock %}

{% block content %}

  <div class="page-header">
    <h1 class="page-title">
      Tags
    </h1>

    <a
      class="button button-add"
      href="{% url 'tasks:tag-create' %}"
    >
      Add tag
    </a>
  </div>

  <div class="table-container">
    <table class="tag-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Update</th>
          <th>Delete</th>
        </tr>
      </thead>

      <tbody>
        {% for tag in tag_list %}
          <tr>
            <td>
              {{ tag.name }}
            </td>

            <td>
              <a
                class="button button-update"
                href="{% url 'tasks:tag-update' tag.pk %}"
              >
                Update
              </a>
            </td>

            <td>
              <a
                class="button button-delete"
                href="{% url 'tasks:tag-delete' tag.pk %}"
              >
                Delete
              </a>
            </td>
          </tr>

        {% empty %}

          <tr>
            <td colspan="3">
              There are no tags yet.
            </td>
          </tr>

        {% endfor %}
      </tbody>
    </table>
  </div>

{% endblock %}
