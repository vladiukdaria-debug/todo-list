{% extends "tasks/base.html" %}

{% block title %}
  {% if object %}Update tag{% else %}Add tag{% endif %}
{% endblock %}

{% block content %}
  <h1>
    {% if object %}Update tag{% else %}Add tag{% endif %}
  </h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">
      Save
    </button>
  </form>

  <a href="{% url 'tasks:tag-list' %}">
    Cancel
  </a>
{% endblock %}
